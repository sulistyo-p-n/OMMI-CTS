		<script>
		//$(document).ready(function() {

				- FITURE - NOKA

			*/
		
			let isAllVisible = false;
					
			const Direction = {
				Left: Symbol("left"),
				Right: Symbol("right"),
				Up: Symbol("up"),
				Down: Symbol("down"),
			}
			
			class Point {
				constructor(x, y) {
					this.x = x;
					this.y = y;
				}
			}
			
			class Variable {
				constructor() {
					this.name = "";
					this.value = false;
				}
			}
			
			class Region {
				contructor() {
					this.code = "";
					this.name = "";
					this.point = new Point(0.0, 0.0);
					this.w = 1920.0;
					this.h = 1080.0;
					this.variables = new Array();
				}
			}
			
			class Style {
				constructor() {
					this.isUseFill = true;
					this.fillColor = 0x666666;
					
					this.isUseLine = true;
					this.lineSize = 1.0;
					this.lineColor = 0xffffff;
					
					this.isUseText = true;
					this.text = "";
					this.fontColor = 0xffffff;
					this.fontSize = 12.0;
					this.fontFamily = "Arial";
					this.isFontBold = false;
					this.isFontItalic = false;
				}
				
				clone() {
					let style = new Style();
					
					style.isUseFill = this.isUseFill;
					style.fillColor = this.fillColor;
					
					style.isUseLine = this.isUseLine;
					style.lineSize = this.lineSize;
					style.lineColor = this.lineColor;
					
					style.isUseText = this.isUseText;
					style.text = this.text;
					style.fontColor = this.fontColor;
					style.fontSize = this.fontSize;
					style.fontFamily = this.fontFamily;
					style.isFontBold = this.isFontBold;
					style.isFontItalic = this.isFontItalic;
					
					return style;
				}
			}
			
			class Mark {
				constructor() {
					this.variable = new Variable();
					this.style = new Style();
					this.isReverse = false;
				}
			}

			class BaseObject {
				constructor() {
					this.point = new Point(0.0, 0.0);
					this.w = 10.0;
					this.h = 10.0;
					
					this.isHideNA = false;
					this.baseStyle = new Style();
					this.marks = new Array();
					
					this.obj = new PIXI.Graphics();
					this.objText = new PIXI.Text();
					
					this.desc = "";
				}
				
				addAt(stage) {
					stage.addChild(this.obj);
					stage.addChild(this.objText);
				}
				
				getActiveStyle() {
					for (const mark of this.marks) {
						if ((!mark.isReverse && mark.variable.value) || (mark.isReverse && !mark.variable.value)) {
							return mark.style;
						}
					}
					if (this.isHideNA && !isAllVisible) {
						return null;
					}
					return this.baseStyle;
				}
				
				setShape(obj, scale) {
					obj.drawRect(0.0, 0.0, this.w * scale, this.h * scale);
				}
				
				setFill(activeStyle, scale) {
					if (activeStyle.isUseFill) {
						this.obj.beginFill(activeStyle.fillColor);
						this.setShape(this.obj, scale);
						this.obj.endFill();
					}
				}
				
				setLine(activeStyle, scale) {
					if (activeStyle.isUseLine) {
						this.obj.lineStyle(activeStyle.lineSize * scale, activeStyle.lineColor, 1);
						this.setShape(this.obj, scale);
						this.obj.endFill();
					}
				}
				
				setText(activeStyle, scale) {
					if (activeStyle.isUseText) {
						this.objText.text = activeStyle.text;
						this.objText.style = new PIXI.TextStyle({
							fontFamily: activeStyle.fontFamily,
							fontSize: activeStyle.fontSize * scale * 1.3,
							fill: activeStyle.fontColor,
							FontStyle: (activeStyle.isFontItalic) ? "italic" : "normal",
							fontWeight: (activeStyle.isFontBold) ? "bold" : "normal",
						});
						this.objText.anchor.set(0.5, 0.5);
					}
				}
				
				isOverLap(ori, w, h, scale) {
					const tolerance = 0;
					let currenPoint = new Point(ori.x + (this.point.x * scale), ori.y + (this.point.y * scale));
					let currentW = this.w * scale + tolerance;
					let currentH = this.h * scale + tolerance;
					
					if ((currenPoint.x + currentW) < -tolerance || currenPoint.x > w) {
						return false;
					}
			 
					if ((currenPoint.y + currentH) < -tolerance || currenPoint.y > h) {
						return false;
					}
					
					return true;
				}
				
				reDraw(ori, w, h, scale) {
					let activeStyle = this.getActiveStyle();
					
					this.obj.clear();
					if ((activeStyle == null) || !(this.isOverLap(ori, w, h, scale))) {
						this.obj.visible = false;
						this.objText.visible = false;
						return;
					}
					
					let currenPoint = new Point(ori.x + (this.point.x * scale), ori.y + (this.point.y * scale));
					let currentW = this.w * scale;
					let currentH = this.h * scale;
					
					this.obj.visible = (currentW > 3 || currentH > 3);
					this.objText.visible = ((activeStyle.fontSize * scale * 1.3) > 4.5);
					
					this.setFill(activeStyle, scale);
					this.setLine(activeStyle, scale);
					this.setText(activeStyle, scale);
					this.obj.position.set(currenPoint.x, currenPoint.y);
					this.objText.position.set(currenPoint.x + currentW/2, currenPoint.y + currentH/2);
				}
				
				gradient(from, to) {
					const c = document.createElement("canvas");
					const ctx = c.getContext("2d");
					const grd = ctx.createLinearGradient(0,0,100,100);
					grd.addColorStop(0, from);
					grd.addColorStop(1, to);
					ctx.fillStyle = grd;
					ctx.fillRect(0,0,100,100);
					return new PIXI.Texture.from(c);
				}
			}
			
			class RectObject extends BaseObject {
				constructor() {
					super();
				}
				
				setShape(obj, scale) {
					obj.drawRect(0.0, 0.0, this.w * scale, this.h * scale);
				}
			}
			
			class RoundRectObject extends BaseObject {
				constructor() {
					super();
					this.roundTip = 4.0;
				}
				
				setShape(obj, scale) {
					obj.drawRoundedRect(0.0, 0.0, this.w * scale, this.h * scale, this.roundTip * scale);
				}
			}
			
			class EllipseObject extends BaseObject {
				constructor() {
					super();
				}
				
				setShape(obj, scale) {
					obj.drawEllipse(this.w * scale/2, this.h * scale/2, this.w * scale/2, this.h * scale/2);
				}
			}
			
			class DiamondObject extends BaseObject {
				constructor() {
					super();
				}
				
				setShape(obj, scale) {
					obj.moveTo(this.w * scale/2, 0.0);
					obj.lineTo(this.w * scale, this.h * scale/2);
					obj.lineTo(this.w * scale/2, this.h * scale);
					obj.lineTo(0.0, this.h * scale/2);
					obj.closePath();
				}
			}
			
			class ParallelogramObject extends BaseObject {
				constructor() {
					super();
					this.size = 4.0;
					this.dir = Direction.Left;
				}
				
				setShape(obj, scale) {
					switch(this.dir) {
						case Direction.Right:
							obj.moveTo(this.w * scale, 0.0);
							obj.lineTo(this.w * scale - this.size * scale, 0.0);
							obj.lineTo(0.0, this.h * scale);
							obj.lineTo(this.size * scale, this.h * scale);
							obj.closePath();
							break;
						case Direction.Up:
							obj.moveTo(0.0, 0.0);
							obj.lineTo(0.0, this.size * scale);
							obj.lineTo(this.w * scale, this.h * scale);
							obj.lineTo(this.w * scale, this.h * scale - this.size * scale);
							obj.closePath();
							break;
						case Direction.Left:
							obj.moveTo(0.0, 0.0);
							obj.lineTo(this.w * scale - this.size * scale, this.h * scale);
							obj.lineTo(this.w * scale, this.h * scale);
							obj.lineTo(this.size * scale, 0.0);
							obj.closePath();
							break;
						case Direction.Down:
							obj.moveTo(0.0, this.h * scale);
							obj.lineTo(this.w * scale, this.size * scale);
							obj.lineTo(this.w * scale, 0.0);
							obj.lineTo(0.0, this.h * scale - this.size * scale);
							obj.closePath();
							break;
					}
				}
			}
			
			class TriangleObject extends BaseObject {

				constructor() {
					super();
					this.dir = Direction.Left;
				}
				
				setShape(obj, scale) {
					switch(this.dir) {
						case Direction.Right:
							obj.moveTo(this.w * scale, this.h * scale/2);
							obj.lineTo(0.0, 0.0);
							obj.lineTo(0.0, this.h * scale);
							obj.closePath();
							break;
						case Direction.Up:
							obj.moveTo(this.w * scale/2, 0.0);
							obj.lineTo(0.0, this.h * scale);
							obj.lineTo(this.w * scale, this.h * scale);
							obj.closePath();
							break;
						case Direction.Left:
							obj.moveTo(0.0, this.h * scale/2);
							obj.lineTo(this.w * scale, this.h * scale);
							obj.lineTo(this.w * scale, 0.0);
							obj.closePath();
							break;
						case Direction.Down:
							obj.moveTo(this.w * scale/2, this.h * scale);
							obj.lineTo(this.w * scale, 0.0);
							obj.lineTo(0.0, 0.0);
							obj.closePath();
							break;
					}
				}
			}
			
			class SignalBackgroundObject extends BaseObject {
				constructor() {
					super();
					
					this.angle = 0.0;
					this.baseAspectCount = 2; // include emergency aspect
					this.isUseCFAspect = true;
					this.isUseShunterAspect = true;
					
					this.baseStyle.isUseFill = false;
					
					this.baseStyle.isUseLine = true;
					this.baseStyle.lineSize = 1.0;
					this.baseStyle.lineColor = 0xffffff;
					
					this.baseStyle.isUseText = true;
				}
				
				setShape(obj, scale) {
					let x = 0.0;
					let y = 0.0;
					let w = 0.0;
					let h = 0.0;
					
					y = ((this.h / 2) - (this.h * (13/19) / 2)) * scale + (-this.h/2 * scale);
					w = this.h * (3/19) * scale;
					h = this.h * (13/19) * scale;
					obj.drawRect( x + (-this.w/2 * scale), y, w, h);
					x += w;
					
					if (this.isUseShunterAspect && (!(this.baseAspectCount > 0) && !this.isUseCFAspect)) {
						y = ((this.h / 2) - (this.h * (3/19) / 2)) * scale + (-this.h/2 * scale);
						w = this.h * (3/19) * scale;
						h = this.h * (3/19) * scale;
						obj.drawRect( x + (-this.w/2 * scale), y, w, h);
						x += w;
						
						y = 0.0 + (-this.h/2 * scale);
						w = (this.w * scale) - x;
						h = this.h * scale;
						obj.drawRoundedRect( x + (-this.w/2 * scale), y, w, h, this.h/2 * scale);
						x += w;
					}
					else if (this.isUseShunterAspect && ((this.baseAspectCount > 0) || this.isUseCFAspect)) {
						y = ((this.h / 2) - (this.h * (3/19) / 2)) * scale + (-this.h/2 * scale);
						w = this.h * (3/19) * scale;
						h = this.h * (3/19) * scale;
						obj.drawRect( x + (-this.w/2 * scale), y, w, h);
						x += w;
					
						y = 0.0 + (-this.h/2 * scale);
						w = this.h * scale;
						h = this.h * scale;
						obj.drawRect( x + (-this.w/2 * scale), y, w, h);
						x += w;
					}
					
					if (this.baseAspectCount > 0) {
						y = ((this.h / 2) - (this.h * (3/19) / 2)) * scale + (-this.h/2 * scale);
						w = this.h * (3/19) * scale;
						h = this.h * (3/19) * scale;
						obj.drawRect( x + (-this.w/2 * scale), y, w, h);
						x += w;
						
						y = 0.0 + (-this.h/2 * scale);
						w = (this.w * scale) - x - (this.isUseCFAspect ? ((this.h + (this.h * (3/19))) * scale) : 0.0);
						h = this.h * scale;
						obj.drawRoundedRect( x + (-this.w/2 * scale), y, w, h, this.h/2 * scale);
						x += w;
					}
					
					if (this.isUseCFAspect) {
						y = ((this.h / 2) - (this.h * (3/19) / 2)) * scale + (-this.h/2 * scale);
						w = this.h * (3/19) * scale;
						h = this.h * (3/19) * scale;
						obj.drawRect( x + (-this.w/2 * scale), y, w, h);
						x += w;
						
						y = 0.0 + (-this.h/2 * scale);
						w = this.h * scale;
						h = this.h * scale;
						obj.drawRect( x + (-this.w/2 * scale), y, w, h);
						x += w;
					}
				}
				
				reDraw(ori, w, h, scale) {
					super.reDraw(ori, w, h, scale);
					
					let currenPoint = new Point(ori.x + (this.point.x * scale), ori.y + (this.point.y * scale));
					let currentW = this.w * scale;
					let currentH = this.h * scale;
					
					this.obj.position.set(currenPoint.x + currentW/2, currenPoint.y + currentH/2);
					this.obj.rotation = Math.PI * 2 * (-this.angle/360);
				}
				
			}
			
			class GradientRectObject extends BaseObject {
				constructor() {
					super();

			function BGRToRGBString(dColor) {
				return '#' + ("000000" + (((dColor & 0xFF) << 16) + (dColor & 0xFF00) + ((dColor >> 16) & 0xFF)).toString(16)).slice(-6);
			}
			
			function RGBStringToBGR(hex) {
				const r = parseInt(hex.slice(1, 3), 16),
					g = parseInt(hex.slice(3, 5), 16),
					b = parseInt(hex.slice(5, 7), 16);
				return (r | g << 8 | b << 16);
			}
			
			function RGBStringToRGB(hex) {
				const r = parseInt(hex.slice(1, 3), 16),
					g = parseInt(hex.slice(3, 5), 16),
					b = parseInt(hex.slice(5, 7), 16);
				return (b | g << 8 | r << 16);
			}
			
			function BGRToRGB(dColor) {
				return RGBStringToRGB(BGRToRGBString(dColor));
			}
			
			function DECToBIN(dec) {
				return (dec >>> 0).toString(2);

			function downListener(event) {
				event.preventDefault();
				event.stopPropagation();
				
				if (event.type == 'touchstart' || event.type == 'touchmove' || event.type == 'touchend' || event.type == 'touchcancel') {
					var evt = (typeof event.originalEvent === 'undefined') ? event : event.originalEvent;
					var touches = evt.touches || evt.changedTouches;
					if (touches.length == 1) {
						isDragable = true;
						startPoint = new Point(touches[0].pageX, touches[0].pageY);
					} else if (touches.length == 2) {
						isDragable = false;
						const x =  touches[1].pageX - touches[0].pageX;
						const y =  touches[1].pageY - touches[0].pageY;
						startPinchLength = Math.sqrt( x*x + y*y );
						startScale = scale;
					}
				} else {
					isDragable = true;
					startPoint = new Point(event.clientX, event.clientY);
				}
				if (isDragable) {
					distance.x = startPoint.x - oriPoint.x;
					distance.y = startPoint.y - oriPoint.y;
				}
			}
			
			function moveListener(event) {
				event.preventDefault();
				event.stopPropagation();
				
				if (event.type == 'touchstart' || event.type == 'touchmove' || event.type == 'touchend' || event.type == 'touchcancel') {
					var evt = (typeof event.originalEvent === 'undefined') ? event : event.originalEvent;
					var touches = evt.touches || evt.changedTouches;
					if (touches.length == 1) {
						endPoint = new Point(touches[0].pageX, touches[0].pageY);
					} else if (touches.length == 2) {
						const x =  touches[1].pageX - touches[0].pageX;
						const y =  touches[1].pageY - touches[0].pageY;
						const endPinchLength = Math.sqrt( x*x + y*y );
						
						zoomFactor = startScale * endPinchLength / startPinchLength;
						let mX = touches[0].pageX + x/2;
						let mY = touches[0].pageY + y/2;
						
						oriPoint.x = mX - (((mX - oriPoint.x) / prevZoomFactor) * zoomFactor);
						oriPoint.y = mY - (((mY - oriPoint.y) / prevZoomFactor) * zoomFactor);
						
						scale = zoomFactor;
						prevZoomFactor = zoomFactor;
					}
				} else {
					endPoint = new Point(event.clientX, event.clientY);
				}
				if (isDragable) {
					oriPoint.x = endPoint.x - distance.x;
					oriPoint.y = endPoint.y - distance.y;
				}
				
				refreshLayoutView();
			}
			
			function upListener(event) {
				event.preventDefault();
				event.stopPropagation();
				
				startPoint = null;
				endPoint = null;
				isDragable = false;
				
				zoomFactor = scale;
				prevZoomFactor = scale;
				startScale = scale;
				
				refreshLayoutView();
			}
			
			function wheelListener(event) {
				event.preventDefault();
				event.stopPropagation();
				
				setZoom(event.deltaY, event.pageX, event.pageY);
			}

				oriPoint.x = 0;

			function setZoom(delta, x, y) {
				if (delta < 0) {
					zoomFactor *= (1.0 + zoomIntensity);
				}
				if (delta > 0) {
					zoomFactor /= (1.0 + zoomIntensity);
				}
				
				let mX = x;
				let mY = y;
				
				oriPoint.x = mX - (((mX - oriPoint.x) / prevZoomFactor) * zoomFactor);
				oriPoint.y = mY - (((mY - oriPoint.y) / prevZoomFactor) * zoomFactor);
				
				scale = zoomFactor;
				prevZoomFactor = zoomFactor;

				refreshLayoutView();
			}
			
			function setRegion(pRegion) {
			
				const region = new Region();
				region.code = pRegion.code;
				region.name = pRegion.name;
				region.point = new Point(pRegion.x, pRegion.y);
				region.w = pRegion.w;
				region.h = pRegion.h;
				region.variables = new Array();
				region.alarms = new Array();
				
				for (const pVariable of pRegion.variables) {
					
					let variable = new Variable();
					variable.name = pVariable.name;
					region.variables.push(variable);
					variables.push(variable);
				}
				
				regions.push(region);
			}

			}

			function refreshLayoutView() {
				for (const layoutObject of layoutObjects) {
					layoutObject.reDraw(oriPoint, app.screen.width, app.screen.height, scale);
				}
				
				$("#status").text("x:" + oriPoint.x.toFixed(3) + ", y:" + oriPoint.y.toFixed(3) + ", s:" + scale.toFixed(3) + ", w:" + (app.screen.width/scale).toFixed(3) + ", h:" + (app.screen.height/scale).toFixed(3));
			}
			
			function resizeView() {
				app.renderer.resize(window.innerWidth, window.innerHeight);
			}
			
			function refreshAlarmView() {
				$('#alarmList li').remove();
				
				let counter = 0;
				for (const region of regions) {
					if (region.alarms.length > 0) {
						$("#alarmList").append('<li><a href="#" onclick="moveViewTo('+ region.point.x + ',' + region.point.y + ',' + region.w + ',' + region.h + '); return false;"><b>'+ region.name + " (" + region.code + ")" +'<b></a></li>');
						for (alarm of region.alarms) {
							$("#alarmList").append('<li><a href="#" onclick="moveViewTo('+ region.point.x + ',' + region.point.y + ',' + region.w + ',' + region.h + '); return false;">'+ alarm.desc + "<br>" + alarm.datetime +'</a></li>');
							counter++;
						}
					}
				}
				
				if (counter > 0) {
					$('#alarmButton').addClass("badge-notif");
					$('#alarmButton').attr('data-badge',((counter > 99) ? 99 : counter));
				} else {
					$('#alarmButton').removeClass("badge-notif");
					$('#alarmButton').attr('data-badge',0);
				}
			}

			const socketIp = window.location.hostname;//'10.10.8.180'; //'localhost'; //'10.10.8.66';
			const socketPort = 4200;
			let socket = null;
			
			let views = [];
			let activeViewIndex = null;
			let activeView = null;
			
			function setSocket() {
				socket = io.connect('http://'+socketIp+':'+socketPort);
				
				socket.on('connect', function(data) {
					socket.emit('getViews', 0xabcdef);
				});
				
				socket.on('views', function(data) {
					views = data;
					setMenu();
					if (!activeViewIndex) activeViewIndex = 0;
					socket.emit('getView', activeViewIndex);
				});
				
				socket.on('view', function(data) {
					activeView = data;
					variables = new Array();
					regions = new Array();
					removeAllChild(app.stage);
					
					setOri();
					
					for (const region of activeView.regions) {
						setRegion(region);
					}
					
					layoutObjects = new Array();
					for (const layout of activeView.layouts) {
						setLayout(layout.fileText, layout.x, layout.y);
					}
					
					resizeView();
					refreshLayoutView();
				});
				
				socket.on('datas', function(data) {
					for (let region of regions) {
						if (!(region.code in data)) {
							continue;
						}
						
						const base = 16;
						for (let i=0; i<data[region.code].data.length; i++) {
							const binString = DECToBIN(data[region.code].data[i]);
							for (let j=0; j<base; j++) {
								if ((j+(i*base)) >= region.variables.length) {
									break;
								}
								if(binString.length > j) {
									region.variables[j+(i*base)].value = (binString[binString.length-1-j] == "1");
								} else {
									region.variables[j+(i*base)].value = false;
								}
							}
						}
						
						region.alarms = data[region.code].alarm;
					}
					refreshAlarmView();
					refreshLayoutView();
				});
				
				setInterval(function() {
					let values = [];
					for (const region of regions) {
						values.push(region.code);
					}
					socket.emit('getDatas', values);
				}, 1000/24);
			}
			
			// Run
			
			<!-- setDummyData(); -->
			
			setSocket();
			
			resizeView();
			refreshLayoutView();
